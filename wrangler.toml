# AnyRouter - Cloudflare Workers Configuration
# Please configure sensitive information through the Cloudflare Dashboard or wrangler secret

name = "anyrouter"
main = "anyrouter.js"
compatibility_date = "2024-01-01"

# ============================================
# Environment Variable Description
# ============================================
# The following variables need to be configured in Cloudflare Dashboard -> Settings -> Variables and Secrets
# Or use the wrangler secret put <variable name> command to set
#
# Required:
#   ADMIN_PASSWORD - Admin panel login password
#
# Optional configuration (key management function):
#   SUPABASE_URL - Supabase project URL
#   SUPABASE_KEY - Supabase anon/public key
#
# Optional configuration (statistics and caching functions):
#   UPSTASH_REDIS_URL - Upstash Redis REST URL
#   UPSTASH_REDIS_TOKEN - Upstash Redis REST Token

# ============================================
# KV Cache Configuration (optional)
# ============================================
# Create KV: npx wrangler kv:namespace create "CONFIG_CACHE"
# [[kv_namespaces]]
# binding = "CONFIG_KV"
# id = "your-kv-namespace-id"
